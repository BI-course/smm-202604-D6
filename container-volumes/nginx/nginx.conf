# =============================================================================
# nginx.conf -- reverse proxy configuration for the ServingMLModels lab.
#
# This one file does three jobs:
#   1. Terminates HTTPS (decrypts incoming traffic using `selfsigned.key`).
#   2. Serves the static frontend files (the four HTML demo pages + index.html).
#   3. Proxies /api/ requests to the Flask app running behind Gunicorn.
# =============================================================================

# ---------------------------------------------------------------------------
# The backend pool.
#
# We name this pool explicitly with an "upstream" block rather than just
# writing `proxy_pass http://flask-gunicorn-app:8000;` directly, for two
# reasons:
#   1. It makes the load-balancing pool a visible, named concept in the
#      config, rather than something that happens implicitly because a
#      hostname happens to resolve to more than one address.
#   2. It is the standard, documented way to configure NGINX load balancing,
#      so it is what you will see in real-world configs and in the NGINX
#      docs.
#
# IMPORTANT: "flask-gunicorn-app" is a Docker
# Compose SERVICE name, not a single container. When you run
#     docker compose ... up -d --scale flask-gunicorn-app=2
# Docker's embedded DNS (127.0.0.11) will resolve that name to the IP
# addresses of BOTH running replicas. NGINX resolves a hostname used in an
# upstream "server" directive ONCE, when its configuration is loaded (i.e.
# on container start, or on `nginx -s reload`), and then load-balances
# across whichever addresses it saw at that moment. It does NOT keep
# re-checking DNS afterwards.
#
# The practical consequence: if you scale flask-gunicorn-app UP or DOWN
# *after* nginx is already running, nginx will keep sending traffic to the
# old set of replicas until you tell it to reload:
#     docker compose restart nginx
# Forgetting this step is the single most common reason "load balancing"
# will look like it is not working in this lab -- it usually is working,
# nginx just has not been told to look again.
upstream flask_backend {
    server flask-gunicorn-app:8000;
}

# ---------------------------------------------------------------------------
# HTTPS server -- this is the one real, secured entry point.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;

    # Serve the frontend's static files (index.html and the four demo pages).
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls through to the Flask app via the named backend pool.
    #
    # NOTE ON THE MISSING TRAILING SLASH -- do not "clean this up":
    # Because `proxy_pass http://flask_backend;` has NO path component after
    # the pool name (not even a bare "/"), NGINX forwards the ORIGINAL
    # request URI to the backend unchanged, including the "/api/" prefix.
    # A request to /api/v1/models/sme-revenue-regressor/predictions reaches
    # Flask as exactly that same path -- which is what api.py expects,
    # since every @app.route() in api.py is defined starting with "/api/vx/",
    # where "x" in "vx" is the API version number.
    #
    # If you add a trailing slash here (`proxy_pass http://flask_backend/;`),
    # NGINX will instead STRIP the "/api/" prefix before forwarding the
    # request, and every one of api.py's routes will 404, because Flask
    # would then receive "/v1/models/.../predictions" instead. This
    # trailing-slash behavior is one of the most common real-world NGINX
    # bugs -- it is included here on purpose as a teaching point.
    location /api/ {
        proxy_pass http://flask_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------------------------------------------------------------------------
# Plain HTTP (port 80) -- redirect everything to HTTPS.
#
# There is no `server_name` here, so this block matches ANY Host header
# arriving on port 80 (it is NGINX's default server for that port). That is
# intentional and fine for this lab: we only have one site, so "catch
# everything on 80 and redirect it" is exactly the behavior we want. If a
# user/developer forgets to type "https://" and requests
# http://127.0.0.1/ or http://localhost/, they land here and are bounced
# straight to the secured site instead of seeing an error or an unencrypted
# response.
# ---------------------------------------------------------------------------
server {
    listen 80;
    return 301 https://$host$request_uri;
}
